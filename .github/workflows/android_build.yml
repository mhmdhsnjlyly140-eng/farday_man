name: Build APK (Auto-Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 👇 این خط جادویی، پوشه اندروید رو از صفر و استاندارد می‌سازه
      - name: Recreate Android Folder
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      # 🔥 این بخش عکس آیکون رو روی اپ اعمال می‌کنه
      - name: Apply Custom Icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick -qq
          convert -background none icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -background none icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -background none icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -background none icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -background none icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk